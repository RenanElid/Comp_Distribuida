server {
    listen 80;
    root /usr/share/nginx/html;

    # Hashed file names: a new build always creates new names, so they can be cached for long.
    # A missing asset must be a real 404, not index.html.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Always revalidate index.html so a rebuild is picked up right away
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Routes like /turmas/1 are not files: hand them to index.html and let React Router decide
    location / {
        try_files $uri $uri/ /index.html;
    }
}
