services:
  kafka:
    image: apache/kafka:4.3.2
    hostname: kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: Iq0qDrX9Q5azosvecNbS4w
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:19092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  db-user:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${POSTGRES_USER:-distrischool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - user_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-administrativo:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: administrativo_db
      POSTGRES_USER: ${POSTGRES_USER:-distrischool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - administrativo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d administrativo_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-alunos:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: alunos_db
      POSTGRES_USER: ${POSTGRES_USER:-distrischool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - alunos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d alunos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  db-academico:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: academico_db
      POSTGRES_USER: ${POSTGRES_USER:-distrischool}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - academico_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d academico_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  flyway-user:
    image: flyway/flyway:11.20.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db-user:5432/user_db
      FLYWAY_USER: ${POSTGRES_USER:-distrischool}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./sql/user-service:/flyway/sql:ro
    depends_on:
      db-user:
        condition: service_healthy

  flyway-administrativo:
    image: flyway/flyway:11.20.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db-administrativo:5432/administrativo_db
      FLYWAY_USER: ${POSTGRES_USER:-distrischool}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./sql/administrativo-service:/flyway/sql:ro
    depends_on:
      db-administrativo:
        condition: service_healthy

  flyway-alunos:
    image: flyway/flyway:11.20.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db-alunos:5432/alunos_db
      FLYWAY_USER: ${POSTGRES_USER:-distrischool}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./sql/alunos-service:/flyway/sql:ro
    depends_on:
      db-alunos:
        condition: service_healthy

  flyway-academico:
    image: flyway/flyway:11.20.0
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db-academico:5432/academico_db
      FLYWAY_USER: ${POSTGRES_USER:-distrischool}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./sql/academico-service:/flyway/sql:ro
    depends_on:
      db-academico:
        condition: service_healthy

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    env_file: ./services/user-service/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      flyway-user:
        condition: service_completed_successfully

  administrativo-service:
    build: ./services/administrativo-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    env_file: ./services/administrativo-service/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      flyway-administrativo:
        condition: service_completed_successfully

  alunos-service:
    build: ./services/alunos-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    env_file: ./services/alunos-service/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      flyway-alunos:
        condition: service_completed_successfully

  academico-service:
    build: ./services/academico-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:8004-8006:8004"
    env_file: ./services/academico-service/.env
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      flyway-academico:
        condition: service_completed_successfully

  gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD", "wget", "-T", "3", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      user-service:
        condition: service_healthy
      administrativo-service:
        condition: service_healthy
      alunos-service:
        condition: service_healthy
      academico-service:
        condition: service_healthy

volumes:
  kafka_data:
  user_db_data:
  administrativo_db_data:
  alunos_db_data:
  academico_db_data:
