resolver 127.0.0.11 valid=10s;

upstream user {
    zone user 64k;
    server user-service:8001 resolve;
}

upstream administrativo {
    zone administrativo 64k;
    server administrativo-service:8002 resolve;
}

upstream alunos {
    zone alunos 64k;
    server alunos-service:8003 resolve;
}

upstream academico {
    zone academico 64k;
    server academico-service:8004 resolve;
}

map $uri $servico {
    ~^/api/auth/                  user;
    ~^/api/usuarios(/|$)          user;
    ~^/api/alunos(/|$)            alunos;
    ~^/api/professores(/|$)       administrativo;
    ~^/api/tecnicos(/|$)          administrativo;
    ~^/api/disciplinas(/|$)       administrativo;
    ~^/api/turmas(/|$)            administrativo;
    ~^/api/matriculas(/|$)        academico;
    ~^/api/notas(/|$)             academico;
    ~^/api/frequencias(/|$)       academico;
    default                       "";
}

map $http_origin $cors_origem_permitida {
    "${CORS_ORIGIN}"  $http_origin;
    default           "";
}

log_format gateway '$remote_addr "$request" $status -> $upstream_addr';

server {
    listen 80;
    access_log /var/log/nginx/access.log gateway;

    add_header Access-Control-Allow-Origin $cors_origem_permitida always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    add_header Vary Origin always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    location = /health {
        default_type application/json;
        return 200 '{"status": "ok"}';
    }

    location /api/ {
        if ($servico = "") {
            return 404;
        }
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$servico;
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
