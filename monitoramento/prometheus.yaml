global:
  scrape_interval: 15s

scrape_configs:
  - job_name: distrischool-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://gateway/health
          - http://frontend/
          - http://user-service:8001/health
          - http://administrativo-service:8002/health
          - http://alunos-service:8003/health
          - http://academico-service:8004/health
          - http://comunicacao-service:8005/health
          - http://mailpit:8025/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        regex: 'http://([^:/]+).*'
        target_label: instance
        replacement: '$1'
      - target_label: __address__
        replacement: blackbox-exporter:9115
